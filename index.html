<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 タロット鑑定書メーカー</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==============================
   RESET & VARIABLES
============================== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy:          #0a1535;
  --navy-mid:      #14225a;
  --navy-light:    #1c3278;
  --blue:          #6aaccc;
  --blue-light:    #a4cfe0;
  --blue-pale:     #cce8f4;
  --purple:        #8a68c0;
  --purple-light:  #c0a4e0;
  --purple-pale:   #e8deff;
  --lavender:      #f2eeff;
  --lavender-mid:  #e2d8f8;
  --gold:          #c4a040;
  --gold-light:    #e0c870;
  --cream:         #fdf8ff;
  --text-dark:     #251848;
  --text-mid:      #4a3a6f;
  --text-light:    #7a6a9f;
  --white:         #ffffff;
  --font-main:     'Klee One', 'Hiragino Mincho ProN', serif;
  --font-ui:       'Zen Maru Gothic', 'Hiragino Kaku Gothic ProN', sans-serif;
  --font-deco:     'Cinzel', serif;
}

/* ==============================
   GLOBAL
============================== */
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-main);
  background: linear-gradient(160deg, var(--navy) 0%, #100e38 40%, #0c1e42 100%);
  min-height: 100vh;
  color: var(--white);
  overflow-x: hidden;
}

/* ==============================
   STARFIELD
============================== */
#starsBg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--dur, 3s) var(--del, 0s) ease-in-out infinite alternate;
}
@keyframes twinkle {
  from { opacity: 0.15; transform: scale(1); }
  to   { opacity: 0.85; transform: scale(1.4); }
}

/* ==============================
   APP HEADER
============================== */
.app-header {
  text-align: center;
  padding: 40px 20px 28px;
  position: relative;
  z-index: 1;
}
.header-moon {
  font-size: 3em;
  display: block;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 24px rgba(164,207,224,0.7));
  animation: moonFloat 4s ease-in-out infinite alternate;
}
@keyframes moonFloat {
  from { transform: translateY(0); }
  to   { transform: translateY(-8px); }
}
.app-title-en {
  font-family: var(--font-deco);
  font-size: clamp(1em, 2.5vw, 1.6em);
  font-weight: 600;
  background: linear-gradient(135deg, var(--blue-light) 0%, var(--purple-light) 50%, var(--gold-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 5px;
  margin-bottom: 6px;
}
.app-title-ja {
  font-family: var(--font-ui);
  font-size: 0.78em;
  color: var(--purple-light);
  letter-spacing: 4px;
  opacity: 0.75;
}

/* ==============================
   LAYOUT
============================== */
.main-layout {
  display: grid;
  grid-template-columns: minmax(300px, 420px) 1fr;
  gap: 24px;
  padding: 0 24px 70px;
  max-width: 1360px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* ==============================
   EDITOR PANEL
============================== */
.editor-panel {
  background: rgba(255,255,255,0.038);
  border: 1px solid rgba(164,207,224,0.14);
  border-radius: 22px;
  padding: 24px 22px;
  backdrop-filter: blur(14px);
  height: fit-content;
}

.sec-header {
  font-family: var(--font-ui);
  font-size: 0.65em;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--blue-light);
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 9px;
  border-bottom: 1px solid rgba(164,207,224,0.18);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-header::before {
  content: '✦';
  color: var(--gold);
  font-size: 1.1em;
  flex-shrink: 0;
}

.form-group { margin-bottom: 13px; }
.form-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

label {
  display: block;
  font-family: var(--font-ui);
  font-size: 0.68em;
  color: rgba(192,164,224,0.85);
  margin-bottom: 5px;
  letter-spacing: 1px;
}

input[type="text"],
input[type="date"],
textarea,
select {
  width: 100%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(164,207,224,0.2);
  border-radius: 10px;
  padding: 10px 13px;
  color: var(--white);
  font-family: var(--font-main);
  font-size: 0.88em;
  transition: border-color 0.22s, background 0.22s, box-shadow 0.22s;
  -webkit-appearance: none;
  min-height: 42px;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--blue);
  background: rgba(255,255,255,0.1);
  box-shadow: 0 0 0 3px rgba(106,172,204,0.12);
}
textarea { resize: vertical; min-height: 80px; line-height: 1.7; }
select option { background: #14225a; color: white; }
input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1) opacity(0.45);
  cursor: pointer;
}

/* Spread selector */
.spread-selector {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
  margin-bottom: 18px;
}
.spread-btn {
  padding: 10px 4px 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(164,207,224,0.16);
  border-radius: 12px;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.72em;
  line-height: 1.5;
  transition: all 0.2s;
  text-align: center;
  min-height: 48px;
}
.spread-btn small { font-size: 0.88em; opacity: 0.6; display: block; }
.spread-btn:hover {
  background: rgba(106,172,204,0.1);
  border-color: rgba(164,207,224,0.4);
  color: var(--blue-light);
}
.spread-btn.active {
  background: rgba(106,172,204,0.14);
  border-color: var(--blue);
  color: var(--blue-light);
  box-shadow: 0 0 14px rgba(106,172,204,0.18);
}

/* Card entries */
.cards-container { display: flex; flex-direction: column; gap: 11px; }
.card-entry {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(192,164,224,0.14);
  border-radius: 14px;
  padding: 14px;
}
.card-entry-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.card-num-label {
  font-family: var(--font-ui);
  font-size: 0.68em;
  color: var(--gold-light);
  letter-spacing: 2.5px;
}
.btn-remove-card {
  background: rgba(220,100,100,0.12);
  border: 1px solid rgba(220,100,100,0.22);
  color: rgba(240,150,150,0.8);
  border-radius: 50%;
  width: 28px; height: 28px;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
  flex-shrink: 0;
}
.btn-remove-card:hover {
  background: rgba(220,100,100,0.25);
  color: rgba(255,180,180,1);
}

.orientation-row { display: flex; gap: 7px; margin-bottom: 9px; }
.ori-btn {
  flex: 1;
  padding: 8px 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(164,207,224,0.18);
  border-radius: 9px;
  color: rgba(255,255,255,0.4);
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.75em;
  transition: all 0.2s;
  text-align: center;
  min-height: 36px;
}
.ori-btn.up.active {
  background: rgba(100,200,150,0.13);
  border-color: rgba(100,200,150,0.45);
  color: rgba(160,230,190,0.95);
}
.ori-btn.rev.active {
  background: rgba(210,100,140,0.12);
  border-color: rgba(210,100,140,0.4);
  color: rgba(235,170,195,0.95);
}

.btn-add-card {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px dashed rgba(164,207,224,0.28);
  border-radius: 12px;
  color: rgba(164,207,224,0.55);
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.82em;
  transition: all 0.22s;
  margin-top: 8px;
  letter-spacing: 1px;
  min-height: 44px;
}
.btn-add-card:hover {
  background: rgba(106,172,204,0.08);
  border-color: var(--blue);
  color: var(--blue-light);
}

.divider {
  height: 1px;
  background: rgba(164,207,224,0.1);
  margin: 20px 0;
}

/* Print button */
.btn-print {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, rgba(138,104,192,0.85), rgba(106,172,204,0.85));
  border: 1px solid rgba(192,164,224,0.35);
  border-radius: 16px;
  color: white;
  font-family: var(--font-ui);
  font-size: 0.96em;
  cursor: pointer;
  letter-spacing: 3px;
  transition: all 0.28s;
  margin-top: 20px;
  position: relative;
  overflow: hidden;
  min-height: 52px;
}
.btn-print::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.btn-print:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(138,104,192,0.4); }
.btn-print:hover::before { opacity: 1; }
.btn-hint {
  font-family: var(--font-ui);
  font-size: 0.62em;
  color: rgba(255,255,255,0.28);
  text-align: center;
  margin-top: 7px;
  letter-spacing: 1px;
  line-height: 1.6;
}

/* ==============================
   PREVIEW PANEL
============================== */
.preview-panel {
  position: sticky;
  top: 22px;
  height: fit-content;
}

/* Preview label */
.preview-label {
  font-family: var(--font-ui);
  font-size: 0.63em;
  letter-spacing: 4px;
  color: rgba(164,207,224,0.45);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 12px;
  display: block;
}

/* ==============================
   鑑定書 REPORT
============================== */
.report {
  background: linear-gradient(155deg, #faf6ff 0%, #f2eaff 25%, #e8f2ff 60%, #f4eeff 100%);
  border-radius: 14px;
  padding: 40px 36px 36px;
  color: var(--text-dark);
  font-family: var(--font-main);
  position: relative;
  overflow: hidden;
  box-shadow: 0 28px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(192,164,224,0.25);
  min-height: 500px;
}

.report-blob-1 {
  position: absolute; top: -40px; right: -40px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(192,164,224,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.report-blob-2 {
  position: absolute; bottom: -30px; left: -30px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(164,207,224,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.report-blob-3 {
  position: absolute; top: 40%; right: -50px;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(192,164,224,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.report-frame {
  position: relative;
  border: 1px solid rgba(138,104,192,0.18);
  border-radius: 9px;
  padding: 28px 26px 24px;
}
.report-frame::before, .report-frame::after {
  content: '✦';
  position: absolute;
  font-size: 0.6em;
  color: rgba(138,104,192,0.35);
}
.report-frame::before { top: -6px; left: 12px; }
.report-frame::after  { bottom: -6px; right: 12px; }
.corner-ornament {
  position: absolute;
  font-size: 0.55em;
  color: rgba(138,104,192,0.3);
}
.corner-ornament.tl { top: -6px; right: 12px; }
.corner-ornament.bl { bottom: -6px; left: 12px; }

/* Report Header */
.report-head { text-align: center; margin-bottom: 20px; }
.rh-moon {
  font-size: 2.4em; display: block; margin-bottom: 9px;
  filter: drop-shadow(0 3px 10px rgba(138,104,192,0.28));
}
.rh-stars {
  font-size: 0.68em; color: var(--gold); letter-spacing: 8px;
  margin-bottom: 11px; opacity: 0.65;
}
.rh-title-en {
  font-family: var(--font-deco);
  font-size: 0.7em; letter-spacing: 8px;
  color: var(--purple); opacity: 0.65; margin-bottom: 5px; text-transform: uppercase;
}
.rh-title-ja {
  font-size: 1.6em; font-weight: 600; letter-spacing: 8px;
  background: linear-gradient(135deg, var(--text-dark) 30%, var(--purple) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.rh-divider {
  border: none; height: 1px; margin: 14px 0 0;
  background: linear-gradient(90deg, transparent, rgba(138,104,192,0.3), rgba(106,172,204,0.3), transparent);
}

/* Info grid */
.report-info {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 7px 18px; margin-bottom: 18px;
  padding: 14px 18px;
  background: rgba(138,104,192,0.045);
  border-radius: 10px; border: 1px solid rgba(138,104,192,0.1);
}
.ri-item { display: flex; flex-direction: column; gap: 2px; }
.ri-item.full { grid-column: 1 / -1; }
.ri-lbl {
  font-family: var(--font-ui);
  font-size: 0.57em; letter-spacing: 2.5px; color: var(--purple); opacity: 0.65; text-transform: uppercase;
}
.ri-val { font-size: 0.82em; color: var(--text-dark); font-weight: 600; line-height: 1.4; }

/* Section title in report */
.r-sec-title {
  font-family: var(--font-ui);
  font-size: 0.6em; letter-spacing: 5px; color: var(--purple);
  text-align: center; margin: 18px 0 13px;
  display: flex; align-items: center; gap: 10px;
  text-transform: uppercase; opacity: 0.75;
}
.r-sec-title::before, .r-sec-title::after {
  content: ''; flex: 1; height: 1px;
}
.r-sec-title::before { background: linear-gradient(90deg, transparent, rgba(138,104,192,0.3)); }
.r-sec-title::after  { background: linear-gradient(90deg, rgba(138,104,192,0.3), transparent); }

/* Cards grid */
.r-cards { display: grid; gap: 12px; }
.r-cards.c1  { grid-template-columns: 1fr; max-width: 340px; margin: 0 auto; }
.r-cards.c2  { grid-template-columns: 1fr 1fr; }
.r-cards.c3  { grid-template-columns: repeat(3, 1fr); }
.r-cards.c2l { grid-template-columns: 1fr 1fr; }

.r-card {
  background: rgba(255,255,255,0.72);
  border: 1px solid rgba(138,104,192,0.13);
  border-radius: 10px; padding: 13px 14px;
  break-inside: avoid;
}
.r-card-pos {
  font-family: var(--font-ui);
  font-size: 0.55em; letter-spacing: 2px; color: var(--purple); opacity: 0.6;
  margin-bottom: 4px; text-transform: uppercase; text-align: center;
}
.r-card-name { font-size: 0.9em; font-weight: 600; color: var(--text-dark); margin-bottom: 5px; line-height: 1.35; text-align: center; }
.r-card-ori {
  display: block; font-size: 0.58em; padding: 2px 9px;
  border-radius: 20px; margin-bottom: 8px; letter-spacing: 1px;
  font-family: var(--font-ui); text-align: center;
}
.ori-up  { background: rgba(80,180,120,0.12); border: 1px solid rgba(80,180,120,0.28); color: #2e7052; }
.ori-rev { background: rgba(190,80,120,0.1);  border: 1px solid rgba(190,80,120,0.25); color: #7a2a48; }
/* カード画像（鑑定書内） */
.r-card-img-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 10px;
}
.r-card-img {
  width: 88px;
  height: 132px;   /* タロットカード比率 2:3 */
  object-fit: cover;
  object-position: center top;
  border-radius: 8px;
  box-shadow: 0 4px 14px rgba(138,104,192,0.25);
  border: 1px solid rgba(192,164,224,0.3);
}
.r-card-img-placeholder {
  width: 88px;
  height: 132px;
  background: linear-gradient(160deg, rgba(192,164,224,0.12), rgba(164,207,224,0.12));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2em;
  border: 1px dashed rgba(138,104,192,0.2);
  color: rgba(138,104,192,0.4);
}

/* 画像アップロード（エディタ内） */
.img-upload-area { margin-bottom: 4px; }
.img-upload-label {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 13px;
  background: rgba(255,255,255,0.05);
  border: 1px dashed rgba(164,207,224,0.3);
  border-radius: 10px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.78em;
  color: rgba(164,207,224,0.65);
  transition: all 0.2s;
  min-height: 42px;
}
.img-upload-label:hover {
  background: rgba(106,172,204,0.09);
  color: var(--blue-light);
  border-color: var(--blue);
}
.img-upload-input { display: none; }
.img-editor-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 8px;
}
.img-editor-preview {
  width: 56px;
  height: 84px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid rgba(192,164,224,0.25);
  flex-shrink: 0;
}
.btn-remove-img {
  background: none;
  border: none;
  color: rgba(240,150,150,0.65);
  font-family: var(--font-ui);
  font-size: 0.7em;
  cursor: pointer;
  padding: 0;
  margin-top: 4px;
  display: block;
}
.btn-remove-img:hover { color: rgba(255,180,180,1); }

/* Overall message */
.r-overall {
  background: rgba(138,104,192,0.055);
  border: 1px solid rgba(138,104,192,0.11);
  border-left: 3px solid rgba(138,104,192,0.35);
  border-radius: 0 10px 10px 0;
  padding: 15px 18px;
  font-size: 0.82em; color: var(--text-mid); line-height: 1.95;
}

/* Footer */
.r-footer {
  margin-top: 22px; display: flex; align-items: flex-end;
  justify-content: space-between;
  padding-top: 14px; border-top: 1px solid rgba(138,104,192,0.13);
}
.r-footer-stars { font-size: 0.68em; color: var(--gold); letter-spacing: 5px; opacity: 0.45; }
.r-reader { text-align: right; }
.r-reader-lbl {
  font-family: var(--font-ui);
  font-size: 0.58em; letter-spacing: 2px; color: var(--purple); opacity: 0.6; margin-bottom: 3px;
}
.r-reader-name { font-size: 0.9em; color: var(--text-dark); font-weight: 600; }

/* ==============================
   縦長（A4ポートレート）レポート
============================== */

/* カードは最大2列（縦長レイアウト向け） */
.r-cards.c3  { grid-template-columns: 1fr 1fr; }

/* レポートをA4縦向き比率でプレビュー */
.report {
  max-width: 620px;
  margin-left: auto;
  margin-right: auto;
}

/* ==============================
   PRINT STYLES（A4縦向き）
============================== */
@media print {
  /* A4縦向き・余白設定 */
  @page {
    size: A4 portrait;
    margin: 14mm 16mm;
  }

  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  #starsBg,
  .app-header,
  .editor-panel,
  .preview-label,
  .btn-print-wrap { display: none !important; }

  .report-blob-1,
  .report-blob-2,
  .report-blob-3 { display: none !important; }

  body { background: white !important; margin: 0; padding: 0; }

  .main-layout {
    display: block !important;
    padding: 0 !important;
    max-width: none !important;
  }

  .preview-panel { position: static !important; }

  .report {
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 10mm 8mm !important;
    max-width: none !important;
    min-height: auto !important;
    background: linear-gradient(155deg, #faf6ff 0%, #f2eaff 25%, #e8f2ff 60%, #f4eeff 100%) !important;
  }

  .report-frame { padding: 5mm 5mm !important; }

  /* ヘッダー縮小 */
  .report-head { margin-bottom: 8px !important; }
  .rh-moon { font-size: 1.6em !important; margin-bottom: 3px !important; }
  .rh-stars { font-size: 0.58em !important; margin-bottom: 5px !important; }
  .rh-title-en { font-size: 0.6em !important; margin-bottom: 2px !important; }
  .rh-title-ja { font-size: 1.15em !important; letter-spacing: 6px !important; }
  .rh-divider { margin: 7px 0 0 !important; }

  /* インフォグリッド縮小 */
  .report-info { margin-bottom: 10px !important; padding: 8px 12px !important; gap: 5px 14px !important; }

  /* セクションタイトル */
  .r-sec-title { margin: 10px 0 7px !important; }

  /* カードボックス */
  .r-card { padding: 8px 10px !important; break-inside: avoid; page-break-inside: avoid; }
  .r-card-img-wrap { margin-bottom: 6px !important; }
  .r-card-img { width: 70px !important; height: 105px !important; }
  .r-card-img-placeholder { width: 70px !important; height: 105px !important; font-size: 1.6em !important; }

  /* 鑑定結果 */
  .r-overall { padding: 10px 14px !important; line-height: 1.75 !important; }

  /* フッター */
  .r-footer { margin-top: 10px !important; padding-top: 8px !important; }

  /* カードグリッドも崩れないように */
  .r-cards { break-inside: avoid; }
}

/* ==============================
   SCROLLBAR
============================== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); }
::-webkit-scrollbar-thumb { background: rgba(106,172,204,0.28); border-radius: 3px; }

/* ==============================
   📱 RESPONSIVE / MOBILE
============================== */
@media (max-width: 800px) {
  /* ヘッダー */
  .app-header { padding: 28px 16px 20px; }
  .header-moon { font-size: 2.4em; }
  .app-title-en { letter-spacing: 2px; }

  /* レイアウト：縦並び */
  .main-layout {
    grid-template-columns: 1fr;
    padding: 0 14px 100px;
    gap: 20px;
  }

  /* プレビューは下に */
  .preview-panel {
    position: static;
    order: 2;
  }
  .editor-panel { order: 1; }

  /* スプレッド選択 2列に */
  .spread-selector { grid-template-columns: repeat(2, 1fr); }

  /* フォーム行も縦に */
  .form-row { grid-template-columns: 1fr; }

  /* 鑑定書プレビューを縮小表示 */
  .report { padding: 28px 20px 24px; }
  .report-frame { padding: 20px 16px 18px; }
  .rh-title-ja { font-size: 1.3em; letter-spacing: 5px; }

  /* カードは1列に（スマせでは縦積み） */
  .r-cards.c3,
  .r-cards.c2,
  .r-cards.c2l { grid-template-columns: 1fr; }

  /* 印刷ボタンを固定 */
  .btn-print-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    background: rgba(10, 21, 53, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(164,207,224,0.15);
    z-index: 100;
  }
  .btn-print { margin-top: 0; }
  .btn-hint { display: none; }

  /* エディタの印刷ボタンを隠す（固定に置き換え） */
  .editor-print-area { display: none; }
}

@media (max-width: 480px) {
  .app-title-en { font-size: 0.9em; letter-spacing: 1px; }
  .spread-selector { grid-template-columns: 1fr 1fr; }
  .r-cards.c3 { grid-template-columns: 1fr; }
  .report { padding: 20px 14px; }
  .report-frame { padding: 16px 12px; }
}
</style>
</head>
<body>

<!-- ── STARS ── -->
<div id="starsBg"></div>

<!-- ── HEADER ── -->
<header class="app-header">
  <span class="header-moon">🌙</span>
  <h1 class="app-title-en">Tarot Reading Report Maker</h1>
  <p class="app-title-ja">タロット鑑定書メーカー</p>
</header>

<!-- ── MAIN ── -->
<main class="main-layout">

  <!-- ── EDITOR ── -->
  <div class="editor-panel">

    <div class="sec-header">基本情報</div>

    <div class="form-row">
      <div class="form-group">
        <label>鑑定日</label>
        <input type="date" id="inpDate">
      </div>
      <div class="form-group">
        <label>占い師名</label>
        <input type="text" id="inpReader" placeholder="例：月の巫女">
      </div>
    </div>
    <div class="form-group">
      <label>ご依頼者様のお名前</label>
      <input type="text" id="inpClient" placeholder="例：山田 花子 様">
    </div>
    <div class="form-group">
      <label>鑑定テーマ・ご質問</label>
      <input type="text" id="inpTheme" placeholder="例：今年の恋愛運について">
    </div>

    <div class="divider"></div>

    <div class="sec-header">スプレッド</div>
    <div class="spread-selector">
      <button class="spread-btn active" data-spread="one">ワンオラクル<small>1枚</small></button>
      <button class="spread-btn" data-spread="three">スリーカード<small>3枚</small></button>
    </div>

    <div class="sec-header">カード</div>
    <div class="cards-container" id="cardsContainer"></div>
    <button class="btn-add-card" id="btnAddCard">＋ カードを追加する</button>

    <div class="divider"></div>

    <div class="sec-header">鑑定結果</div>
    <div class="form-group">
      <textarea id="inpOverall" placeholder="鑑定全体のメッセージ・アドバイスをご記入ください..." rows="5"></textarea>
    </div>

    <div class="editor-print-area">
      <div class="divider"></div>
      <button class="btn-print" id="btnPrint">🌙 &nbsp; PDF で保存する</button>
      <p class="btn-hint">ブラウザの印刷画面が開きます。「PDFに保存」を選択してください。</p>
    </div>

  </div>

  <!-- ── PREVIEW ── -->
  <div class="preview-panel">

    <p class="preview-label">✦ &nbsp; プレビュー（A4縦向き）&nbsp; ✦</p>

    <div class="report" id="report">
            <div class="report-blob-1"></div>
      <div class="report-blob-2"></div>
      <div class="report-blob-3"></div>
      <div class="report-frame" id="reportFrame">
        <span class="corner-ornament tl">✦</span>
        <span class="corner-ornament bl">✦</span>
      </div>
    </div>

  </div>

</main>

<!-- モバイル用固定印刷ボタン -->
<div class="btn-print-wrap" id="mobilePrintWrap">
  <button class="btn-print" id="btnPrintMobile">🌙 &nbsp; PDF で保存する</button>
</div>

<!-- カード名 datalist -->
<datalist id="tarotList">
  <option value="愚者（The Fool）">
  <option value="魔術師（The Magician）">
  <option value="女教皇（The High Priestess）">
  <option value="女帝（The Empress）">
  <option value="皇帝（The Emperor）">
  <option value="法王（The Hierophant）">
  <option value="恋人たち（The Lovers）">
  <option value="戦車（The Chariot）">
  <option value="力（Strength）">
  <option value="隠者（The Hermit）">
  <option value="運命の輪（Wheel of Fortune）">
  <option value="正義（Justice）">
  <option value="吊るされた男（The Hanged Man）">
  <option value="死神（Death）">
  <option value="節制（Temperance）">
  <option value="悪魔（The Devil）">
  <option value="塔（The Tower）">
  <option value="星（The Star）">
  <option value="月（The Moon）">
  <option value="太陽（The Sun）">
  <option value="審判（Judgement）">
  <option value="世界（The World）">
  <option value="ワンドのエース"><option value="ワンドの2"><option value="ワンドの3">
  <option value="ワンドの4"><option value="ワンドの5"><option value="ワンドの6">
  <option value="ワンドの7"><option value="ワンドの8"><option value="ワンドの9">
  <option value="ワンドの10"><option value="ワンドのペイジ"><option value="ワンドのナイト">
  <option value="ワンドのクイーン"><option value="ワンドのキング">
  <option value="カップのエース"><option value="カップの2"><option value="カップの3">
  <option value="カップの4"><option value="カップの5"><option value="カップの6">
  <option value="カップの7"><option value="カップの8"><option value="カップの9">
  <option value="カップの10"><option value="カップのペイジ"><option value="カップのナイト">
  <option value="カップのクイーン"><option value="カップのキング">
  <option value="ソードのエース"><option value="ソードの2"><option value="ソードの3">
  <option value="ソードの4"><option value="ソードの5"><option value="ソードの6">
  <option value="ソードの7"><option value="ソードの8"><option value="ソードの9">
  <option value="ソードの10"><option value="ソードのペイジ"><option value="ソードのナイト">
  <option value="ソードのクイーン"><option value="ソードのキング">
  <option value="ペンタクルのエース"><option value="ペンタクルの2"><option value="ペンタクルの3">
  <option value="ペンタクルの4"><option value="ペンタクルの5"><option value="ペンタクルの6">
  <option value="ペンタクルの7"><option value="ペンタクルの8"><option value="ペンタクルの9">
  <option value="ペンタクルの10"><option value="ペンタクルのペイジ"><option value="ペンタクルのナイト">
  <option value="ペンタクルのクイーン"><option value="ペンタクルのキング">
</datalist>

<script>
/* ==============================
   SPREAD PRESETS
============================== */
const SPREADS = {
  one:   { name:'ワンオラクル', pos:[''] },
  three: { name:'スリーカード', pos:['過去','現在','未来'] },
};

/* ==============================
   STATE
============================== */
let state = {
  spread: 'one',
  cards:  [],
};

/* ==============================
   INIT
============================== */
document.addEventListener('DOMContentLoaded', () => {
  createStars();
  setToday();
  loadSpread('one');
  bindAll();
  render();
  hideMobilePrint();
});

/* ==============================
   MOBILE PRINT BUTTON
============================== */
function hideMobilePrint() {
  // モバイル以外では固定印刷ボタンを非表示
  if (window.innerWidth > 800) {
    const w = document.getElementById('mobilePrintWrap');
    if (w) w.style.display = 'none';
  }
}

/* ==============================
   STARS
============================== */
function createStars() {
  const bg = document.getElementById('starsBg');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.2 + 0.4;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --dur:${2+Math.random()*3.5}s;
      --del:${Math.random()*4}s;
      opacity:${0.1+Math.random()*0.45};
    `;
    bg.appendChild(s);
  }
}

/* ==============================
   DATE
============================== */
function setToday() {
  const d = new Date();
  document.getElementById('inpDate').value =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ==============================
   SPREAD
============================== */
function loadSpread(key) {
  state.spread = key;
  document.querySelectorAll('.spread-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.spread === key));
  state.cards = SPREADS[key].pos.map(p => ({ pos:p, name:'', ori:'正位置', imgUrl:'' }));
  renderCardEditor();
  render();
}

/* ==============================
   CARD EDITOR
============================== */
function renderCardEditor() {
  const c = document.getElementById('cardsContainer');
  c.innerHTML = '';
  state.cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card-entry';
    el.innerHTML = `
      <div class="card-entry-header">
        <span class="card-num-label">✦ カード ${i+1}</span>
        <button class="btn-remove-card" onclick="removeCard(${i})" title="削除">×</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>ポジション名</label>
          <input type="text" placeholder="例：過去" value="${esc(card.pos)}"
            oninput="state.cards[${i}].pos=this.value;render()">
        </div>
        <div class="form-group">
          <label>カード名</label>
          <input type="text" list="tarotList" placeholder="例：月（The Moon）" value="${esc(card.name)}"
            oninput="state.cards[${i}].name=this.value;render()">
        </div>
      </div>
      <div class="form-group">
        <label>向き</label>
        <div class="orientation-row">
          <button class="ori-btn up ${card.ori==='正位置'?'active':''}"
            onclick="setOri(${i},'正位置',this)">☽ 正位置</button>
          <button class="ori-btn rev ${card.ori==='逆位置'?'active':''}"
            onclick="setOri(${i},'逆位置',this)">☾ 逆位置</button>
        </div>
      </div>
      <div class="form-group img-upload-area">
        <label>カード画像</label>
        <label class="img-upload-label" for="cardImg_${i}">
          📷 &nbsp;${card.imgUrl ? '画像を変更する' : '画像をアップロード'}
        </label>
        <input class="img-upload-input" type="file" accept="image/*"
          id="cardImg_${i}" onchange="setCardImage(${i}, this)">
        ${card.imgUrl ? `
        <div class="img-editor-row">
          <img class="img-editor-preview" src="${card.imgUrl}" alt="カード画像">
          <button class="btn-remove-img" onclick="removeCardImage(${i})">✕ 削除</button>
        </div>` : ''}
      </div>
    `;
    c.appendChild(el);
  });
}

function setOri(i, val, btn) {
  state.cards[i].ori = val;
  btn.closest('.orientation-row').querySelectorAll('.ori-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function removeCard(i) {
  state.cards.splice(i, 1);
  renderCardEditor();
  render();
}

function addCard() {
  state.cards.push({ pos:'', name:'', ori:'正位置', imgUrl:'' });
  renderCardEditor();
  render();
}

function setCardImage(i, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    state.cards[i].imgUrl = e.target.result;
    renderCardEditor();
    render();
  };
  reader.readAsDataURL(file);
}

function removeCardImage(i) {
  state.cards[i].imgUrl = '';
  renderCardEditor();
  render();
}

/* ==============================
   BIND EVENTS
============================== */
function bindAll() {
  document.querySelectorAll('.spread-btn').forEach(b =>
    b.addEventListener('click', () => loadSpread(b.dataset.spread)));
  document.getElementById('btnAddCard').addEventListener('click', addCard);
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  const mb = document.getElementById('btnPrintMobile');
  if (mb) mb.addEventListener('click', () => window.print());
  ['inpDate','inpReader','inpClient','inpTheme','inpOverall']
    .forEach(id => document.getElementById(id).addEventListener('input', render));
  window.addEventListener('resize', hideMobilePrint);
}

/* ==============================
   RENDER REPORT
============================== */
function render() {
  const client  = document.getElementById('inpClient').value.trim();
  const reader  = document.getElementById('inpReader').value.trim();
  const dateVal = document.getElementById('inpDate').value;
  const theme   = document.getElementById('inpTheme').value.trim();
  const overall = document.getElementById('inpOverall').value.trim();

  const dateStr = dateVal
    ? new Date(dateVal + 'T00:00:00').toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' })
    : '';
  const spreadName = SPREADS[state.spread]?.name || '';

  const n = state.cards.length;
  let gridCls = 'c1';
  if      (n === 2) gridCls = 'c2';
  else if (n === 3) gridCls = 'c3';
  else if (n >= 4)  gridCls = 'c2l';

  const cardsHtml = n === 0 ? '' : `
    <div class="r-sec-title">カード</div>
    <div class="r-cards ${gridCls}">
      ${state.cards.map(card => `
        <div class="r-card">
          <div class="r-card-img-wrap">
            ${card.imgUrl
              ? `<img class="r-card-img" src="${card.imgUrl}" alt="${html(card.name)}">`
              : `<div class="r-card-img-placeholder">🌙</div>`}
          </div>
          ${card.pos ? `<div class="r-card-pos">${html(card.pos)}</div>` : ''}
          <div class="r-card-name">${card.name ? html(card.name) : '―'}</div>
          <span class="r-card-ori ${card.ori==='正位置'?'ori-up':'ori-rev'}">
            ${card.ori==='正位置' ? '☽ 正位置' : '☾ 逆位置'}
          </span>
        </div>
      `).join('')}
    </div>
  `;

  const overallHtml = overall ? `
    <div class="r-sec-title">鑑定結果</div>
    <div class="r-overall">${html(overall).replace(/\n/g,'<br>')}</div>
  ` : '';

  const infoRows = [
    { lbl:'鑑定日',     val: dateStr || '―' },
    { lbl:'スプレッド', val: spreadName },
    { lbl:'ご依頼者様', val: client ? html(client) + ' 様' : '―' },
    ...(theme ? [{ lbl:'鑑定テーマ', val: html(theme), full: true }] : []),
  ];
  const infoHtml = infoRows.map(r =>
    `<div class="ri-item${r.full?' full':''}">
      <span class="ri-lbl">${r.lbl}</span>
      <span class="ri-val">${r.val}</span>
    </div>`
  ).join('');

  document.getElementById('reportFrame').innerHTML = `
    <span class="corner-ornament tl">✦</span>
    <span class="corner-ornament bl">✦</span>

    <div class="report-head">
      <span class="rh-moon">🌙</span>
      <div class="rh-stars">✦ &nbsp; ✧ &nbsp; ★ &nbsp; ✧ &nbsp; ✦</div>
      <div class="rh-title-en">Tarot Reading Report</div>
      <div class="rh-title-ja">タロット鑑定書</div>
      <hr class="rh-divider">
    </div>

    <div class="report-info">${infoHtml}</div>

    ${cardsHtml}
    ${overallHtml}

    <div class="r-footer">
      <div class="r-footer-stars">✦ &nbsp; 🌙 &nbsp; ✧ &nbsp; ⭐ &nbsp; ✦</div>
      <div class="r-reader">
        <div class="r-reader-lbl">占い師</div>
        <div class="r-reader-name">${reader ? html(reader) : '―'}</div>
      </div>
    </div>
  `;
}

/* ==============================
   UTILS
============================== */
function html(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function esc(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
