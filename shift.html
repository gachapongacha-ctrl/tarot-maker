<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 シフト管理 & 給料計算</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:          #f4f6fb;
  --card:        #ffffff;
  --primary:     #5b7cfa;
  --primary-dark:#3f5ee0;
  --primary-pale:#e8edff;
  --accent:      #ff8fab;
  --accent-pale: #ffe9f0;
  --green:       #2eb086;
  --green-pale:  #e3f6ef;
  --text:        #2b3147;
  --text-mid:    #5a617c;
  --text-light:  #9aa1b9;
  --line:        #e3e7f2;
  --danger:      #e85d75;
  --radius:      16px;
  --font:        'Zen Maru Gothic', 'Hiragino Kaku Gothic ProN', sans-serif;
}

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 90px;
}

.container { max-width: 480px; margin: 0 auto; padding: 0 14px; }

/* ===== HEADER ===== */
.app-header {
  text-align: center;
  padding: 22px 16px 14px;
}
.app-header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.app-header p {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

/* ===== TAB BAR ===== */
.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  z-index: 50;
}
.tabbar button {
  flex: 1;
  max-width: 220px;
  border: none;
  background: transparent;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-light);
  padding: 10px 6px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.tabbar button .ico { display: block; font-size: 20px; margin-bottom: 2px; }
.tabbar button.active {
  color: var(--primary-dark);
  background: var(--primary-pale);
}

.screen { display: none; }
.screen.active { display: block; }

/* ===== MONTH NAV ===== */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 8px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(43,49,71,0.06);
}
.month-nav h2 { font-size: 17px; font-weight: 700; }
.month-nav button {
  border: none;
  background: var(--primary-pale);
  color: var(--primary-dark);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  width: 38px; height: 38px;
  border-radius: 50%;
  cursor: pointer;
}
.month-nav button:active { transform: scale(0.92); }

/* ===== CALENDAR ===== */
.calendar {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px;
  box-shadow: 0 2px 8px rgba(43,49,71,0.06);
}
.cal-week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 6px;
}
.cal-week span {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-mid);
}
.cal-week span:first-child { color: var(--danger); }
.cal-week span:last-child  { color: var(--primary); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day {
  min-height: 58px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: #fafbfe;
  padding: 4px 2px;
  text-align: center;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: background 0.15s;
}
.cal-day:active { background: var(--primary-pale); }
.cal-day.empty { background: transparent; cursor: default; }
.cal-day .num { font-size: 13px; font-weight: 500; line-height: 1.2; }
.cal-day.sun .num { color: var(--danger); }
.cal-day.sat .num { color: var(--primary); }
.cal-day.today { border-color: var(--primary); }
.cal-day.has-shift { background: var(--accent-pale); }
.cal-day .shift-time {
  font-size: 9px;
  font-weight: 700;
  color: #d6336c;
  line-height: 1.25;
  word-break: keep-all;
}
.cal-day .shift-hours {
  font-size: 9px;
  color: var(--text-mid);
}

/* ===== MONTH SUMMARY MINI ===== */
.mini-summary {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.mini-summary .chip {
  flex: 1;
  background: var(--card);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(43,49,71,0.06);
}
.mini-summary .chip .label { font-size: 10px; color: var(--text-light); }
.mini-summary .chip .value { font-size: 16px; font-weight: 700; color: var(--primary-dark); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(30,34,52,0.45);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  width: 100%;
  max-width: 480px;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  animation: slideUp 0.2s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-mid);
  margin-bottom: 4px;
}
.field input, .field select {
  width: 100%;
  font-family: var(--font);
  font-size: 16px;
  padding: 10px 12px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #fafbfe;
  color: var(--text);
  outline: none;
}
.field input:focus, .field select:focus { border-color: var(--primary); }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.field .hint { font-size: 10px; color: var(--text-light); margin-top: 3px; }

.modal-buttons { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  flex: 1;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  padding: 13px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-ghost   { background: var(--primary-pale); color: var(--primary-dark); }
.btn-danger  { background: #fdeef1; color: var(--danger); flex: 0 0 auto; padding: 13px 16px; }

/* ===== SALARY SCREEN ===== */
.settings-card, .salary-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(43,49,71,0.06);
}
.settings-card h3, .salary-card h3 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.salary-rows { display: flex; flex-direction: column; }
.salary-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 9px 2px;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}
.salary-row .name { color: var(--text-mid); }
.salary-row .amount { font-weight: 700; font-size: 15px; }
.salary-row.minus .amount { color: var(--danger); }
.salary-row.gross .amount { color: var(--primary-dark); }

.net-box {
  margin-top: 14px;
  background: linear-gradient(135deg, var(--green) 0%, #25997a 100%);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  color: #fff;
}
.net-box .label { font-size: 12px; font-weight: 700; opacity: 0.9; }
.net-box .amount { font-size: 30px; font-weight: 700; letter-spacing: 0.02em; }
.net-box .note { font-size: 10px; opacity: 0.85; margin-top: 4px; }

.empty-note {
  text-align: center;
  font-size: 12px;
  color: var(--text-light);
  padding: 18px 0;
}
</style>
</head>
<body>

<header class="app-header">
  <h1>📅 シフト管理 & 給料計算</h1>
  <p>カレンダーにシフトを入れて、今月のお給料をチェック！</p>
</header>

<!-- ========== カレンダー画面 ========== -->
<div class="screen active" id="screenCalendar">
  <div class="container">
    <div class="month-nav">
      <button id="calPrev" aria-label="前の月">◀</button>
      <h2 id="calTitle"></h2>
      <button id="calNext" aria-label="次の月">▶</button>
    </div>

    <div class="calendar">
      <div class="cal-week">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="mini-summary">
      <div class="chip">
        <div class="label">出勤日数</div>
        <div class="value" id="miniDays">0日</div>
      </div>
      <div class="chip">
        <div class="label">勤務時間</div>
        <div class="value" id="miniHours">0h</div>
      </div>
      <div class="chip">
        <div class="label">見込み手取り</div>
        <div class="value" id="miniNet">¥0</div>
      </div>
    </div>
  </div>
</div>

<!-- ========== 給料画面 ========== -->
<div class="screen" id="screenSalary">
  <div class="container">
    <div class="month-nav">
      <button id="salPrev" aria-label="前の月">◀</button>
      <h2 id="salTitle"></h2>
      <button id="salNext" aria-label="次の月">▶</button>
    </div>

    <div class="settings-card">
      <h3>⚙️ 給与の設定</h3>
      <div class="field-row">
        <div class="field">
          <label for="setWage">時給（円）</label>
          <input type="number" id="setWage" inputmode="numeric" min="0" step="1">
        </div>
        <div class="field">
          <label for="setTransport">交通費（円/日）</label>
          <input type="number" id="setTransport" inputmode="numeric" min="0" step="1">
        </div>
      </div>
      <div class="field">
        <label for="setInsurance">雇用保険料率（％・本人負担分）</label>
        <input type="number" id="setInsurance" inputmode="decimal" min="0" step="0.01">
        <div class="hint">2025年度の一般の事業は 0.55%（変わったらここを直してね）</div>
      </div>
    </div>

    <div class="salary-card">
      <h3>💰 今月のお給料</h3>
      <div class="salary-rows" id="salaryRows"></div>
      <div class="net-box">
        <div class="label">手取り見込み</div>
        <div class="amount" id="netAmount">¥0</div>
        <div class="note">※ 雇用保険のみ控除した概算です（所得税・住民税などは含みません）</div>
      </div>
    </div>
  </div>
</div>

<!-- ========== シフト入力モーダル ========== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">シフト入力</h3>
    <div class="field-row">
      <div class="field">
        <label for="inpStart">開始</label>
        <input type="time" id="inpStart" value="09:00">
      </div>
      <div class="field">
        <label for="inpEnd">終了</label>
        <input type="time" id="inpEnd" value="17:00">
      </div>
    </div>
    <div class="field">
      <label for="inpBreak">休憩（分）</label>
      <input type="number" id="inpBreak" inputmode="numeric" min="0" step="5" value="60">
      <div class="hint">終了が開始より早い場合は日をまたぐ夜勤として計算します</div>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-danger" id="btnDelete">削除</button>
      <button class="btn btn-ghost" id="btnCancel">閉じる</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- ========== タブバー ========== -->
<nav class="tabbar">
  <button class="active" id="tabCalendar"><span class="ico">🗓️</span>シフト</button>
  <button id="tabSalary"><span class="ico">💰</span>給料</button>
</nav>

<script>
'use strict';

/* ==============================
   STORAGE
============================== */
const STORE_KEY = 'shiftApp.v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 壊れたデータは初期化 */ }
  return {
    settings: { wage: 1200, transport: 500, insuranceRate: 0.55 },
    shifts: {}   // "YYYY-MM-DD": { start:"09:00", end:"17:00", breakMin:60 }
  };
}

function saveStore() {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

const store = loadStore();

/* ==============================
   STATE
============================== */
const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();   // 0-11、カレンダー/給料画面で共通
let editingDate = null;             // "YYYY-MM-DD"

/* ==============================
   HELPERS
============================== */
const pad2 = n => String(n).padStart(2, '0');
const dateKey = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');

function shiftHours(shift) {
  const [sh, sm] = shift.start.split(':').map(Number);
  const [eh, em] = shift.end.split(':').map(Number);
  let minutes = (eh * 60 + em) - (sh * 60 + sm);
  if (minutes <= 0) minutes += 24 * 60;          // 日またぎ夜勤
  minutes -= (shift.breakMin || 0);
  return Math.max(0, minutes) / 60;
}

function monthShifts(year, month) {
  const prefix = `${year}-${pad2(month + 1)}-`;
  return Object.entries(store.shifts)
    .filter(([k]) => k.startsWith(prefix))
    .sort(([a], [b]) => a.localeCompare(b));
}

function calcSalary(year, month) {
  const { wage, transport, insuranceRate } = store.settings;
  const shifts = monthShifts(year, month);
  const days = shifts.length;
  const hours = shifts.reduce((sum, [, s]) => sum + shiftHours(s), 0);
  const basePay = Math.floor(hours * wage);
  const transportTotal = transport * days;
  const gross = basePay + transportTotal;
  // 雇用保険料は通勤手当も含めた総支給額が対象
  const insurance = Math.round(gross * insuranceRate / 100);
  const net = gross - insurance;
  return { days, hours, basePay, transportTotal, gross, insurance, net };
}

function formatHours(h) {
  const whole = Math.floor(h);
  const min = Math.round((h - whole) * 60);
  return min === 0 ? `${whole}h` : `${whole}h${min}m`;
}

/* ==============================
   CALENDAR RENDER
============================== */
const calGrid = document.getElementById('calGrid');
const calTitle = document.getElementById('calTitle');

function renderCalendar() {
  calTitle.textContent = `${viewYear}年 ${viewMonth + 1}月`;
  calGrid.innerHTML = '';

  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const lastDay = new Date(viewYear, viewMonth + 1, 0).getDate();

  for (let i = 0; i < firstDow; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day empty';
    calGrid.appendChild(cell);
  }

  for (let d = 1; d <= lastDay; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const dow = (firstDow + d - 1) % 7;
    const shift = store.shifts[key];

    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    if (viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate()) {
      cell.classList.add('today');
    }

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d;
    cell.appendChild(num);

    if (shift) {
      cell.classList.add('has-shift');
      const time = document.createElement('span');
      time.className = 'shift-time';
      time.textContent = `${shift.start}〜`;
      cell.appendChild(time);
      const hrs = document.createElement('span');
      hrs.className = 'shift-hours';
      hrs.textContent = formatHours(shiftHours(shift));
      cell.appendChild(hrs);
    }

    cell.addEventListener('click', () => openModal(key));
    calGrid.appendChild(cell);
  }

  renderMiniSummary();
}

function renderMiniSummary() {
  const s = calcSalary(viewYear, viewMonth);
  document.getElementById('miniDays').textContent = `${s.days}日`;
  document.getElementById('miniHours').textContent = formatHours(s.hours);
  document.getElementById('miniNet').textContent = yen(s.net);
}

/* ==============================
   MODAL
============================== */
const overlay = document.getElementById('modalOverlay');
const inpStart = document.getElementById('inpStart');
const inpEnd = document.getElementById('inpEnd');
const inpBreak = document.getElementById('inpBreak');

function openModal(key) {
  editingDate = key;
  const [y, m, d] = key.split('-').map(Number);
  const dow = ['日', '月', '火', '水', '木', '金', '土'][new Date(y, m - 1, d).getDay()];
  document.getElementById('modalTitle').textContent = `${m}月${d}日（${dow}）のシフト`;

  const shift = store.shifts[key];
  if (shift) {
    inpStart.value = shift.start;
    inpEnd.value = shift.end;
    inpBreak.value = shift.breakMin;
  }
  // 未入力の日は前回の入力値をそのまま引き継ぐ（連続入力がラク）

  document.getElementById('btnDelete').style.display = shift ? 'block' : 'none';
  overlay.classList.add('open');
}

function closeModal() {
  overlay.classList.remove('open');
  editingDate = null;
}

document.getElementById('btnSave').addEventListener('click', () => {
  if (!editingDate) return;
  if (!inpStart.value || !inpEnd.value) { alert('開始・終了時刻を入れてね'); return; }
  store.shifts[editingDate] = {
    start: inpStart.value,
    end: inpEnd.value,
    breakMin: Math.max(0, parseInt(inpBreak.value, 10) || 0)
  };
  saveStore();
  closeModal();
  renderCalendar();
  renderSalary();
});

document.getElementById('btnDelete').addEventListener('click', () => {
  if (!editingDate) return;
  delete store.shifts[editingDate];
  saveStore();
  closeModal();
  renderCalendar();
  renderSalary();
});

document.getElementById('btnCancel').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

/* ==============================
   SALARY RENDER
============================== */
const salTitle = document.getElementById('salTitle');
const salaryRows = document.getElementById('salaryRows');

function renderSalary() {
  salTitle.textContent = `${viewYear}年 ${viewMonth + 1}月`;
  const s = calcSalary(viewYear, viewMonth);

  if (s.days === 0) {
    salaryRows.innerHTML = '<div class="empty-note">この月のシフトはまだありません🌱<br>カレンダーから入れてみてね</div>';
  } else {
    salaryRows.innerHTML = '';
    const rows = [
      ['出勤日数', `${s.days}日`, ''],
      ['勤務時間', formatHours(s.hours), ''],
      [`基本給（時給 ${yen(store.settings.wage)}）`, yen(s.basePay), ''],
      [`交通費（${yen(store.settings.transport)} × ${s.days}日）`, yen(s.transportTotal), ''],
      ['総支給額', yen(s.gross), 'gross'],
      [`雇用保険料（${store.settings.insuranceRate}%）`, '− ' + yen(s.insurance), 'minus']
    ];
    for (const [name, amount, cls] of rows) {
      const row = document.createElement('div');
      row.className = 'salary-row' + (cls ? ' ' + cls : '');
      row.innerHTML = `<span class="name"></span><span class="amount"></span>`;
      row.querySelector('.name').textContent = name;
      row.querySelector('.amount').textContent = amount;
      salaryRows.appendChild(row);
    }
  }

  document.getElementById('netAmount').textContent = yen(s.net);
}

/* ==============================
   SETTINGS
============================== */
const setWage = document.getElementById('setWage');
const setTransport = document.getElementById('setTransport');
const setInsurance = document.getElementById('setInsurance');

function loadSettingsInputs() {
  setWage.value = store.settings.wage;
  setTransport.value = store.settings.transport;
  setInsurance.value = store.settings.insuranceRate;
}

function onSettingChange() {
  store.settings.wage = Math.max(0, parseInt(setWage.value, 10) || 0);
  store.settings.transport = Math.max(0, parseInt(setTransport.value, 10) || 0);
  store.settings.insuranceRate = Math.max(0, parseFloat(setInsurance.value) || 0);
  saveStore();
  renderSalary();
  renderMiniSummary();
}

[setWage, setTransport, setInsurance].forEach(el => el.addEventListener('input', onSettingChange));

/* ==============================
   MONTH NAV & TABS
============================== */
function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
  renderSalary();
}

document.getElementById('calPrev').addEventListener('click', () => changeMonth(-1));
document.getElementById('calNext').addEventListener('click', () => changeMonth(1));
document.getElementById('salPrev').addEventListener('click', () => changeMonth(-1));
document.getElementById('salNext').addEventListener('click', () => changeMonth(1));

const tabCalendar = document.getElementById('tabCalendar');
const tabSalary = document.getElementById('tabSalary');

function showScreen(name) {
  document.getElementById('screenCalendar').classList.toggle('active', name === 'calendar');
  document.getElementById('screenSalary').classList.toggle('active', name === 'salary');
  tabCalendar.classList.toggle('active', name === 'calendar');
  tabSalary.classList.toggle('active', name === 'salary');
}

tabCalendar.addEventListener('click', () => showScreen('calendar'));
tabSalary.addEventListener('click', () => showScreen('salary'));

/* ==============================
   INIT
============================== */
loadSettingsInputs();
renderCalendar();
renderSalary();
</script>
</body>
